  <body>
    <div id="s">Открываю…</div>
    <script>
      var FALLBACK = '/lovelace/0';
      var KEY = 'ha_home_launcher_target';
      // ?to= may retarget this launcher, but only inside THIS Home Assistant:
      // resolve it the way the browser would and demand the same origin, which
      // rejects https://other, //host, data: and javascript:.
      function sameOriginPath(v) {
        if (!v) return null;
        try {
          var u = new URL(v, location.href);
          return u.origin === location.origin ? u.pathname + u.search + u.hash : null;
        } catch (e) { return null; }
      }
      var asked = sameOriginPath(new URLSearchParams(location.search).get('to'));
      if (asked) { try { localStorage.setItem(KEY, asked); } catch (e) {} }
      var target = asked || (function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } })() || FALLBACK;
      // Never leave the launcher in the back stack.
      location.replace(target);
    </script>
